name: Check blog
on:
  push:
    branches: [master, codex/notebook-redesign]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check generated pages and local links
        run: python3 scripts/check-built-blog.py
