title: Pin'Log
name: "Pin's Blog"
author: Pin Qian
twitter_username: qian_pin
baseurl: "/pin-log"
description: Learning notes, open questions, and observations from wherever curiosity leads.
profile_url: "https://pinqian77.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
excerpt_separator: <!--more-->
plugins:
  - jekyll-feed
  - jekyll-archives
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - scripts
  - node_modules
  - package.json
  - package-lock.json
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  toc_levels: 1..3


url: "https://pinqian77.github.io"
lang: en
