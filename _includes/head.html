<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  {% assign page_description = page.summary | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 180 %}
  <meta name="description" content="{{ page_description | escape }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page_description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <script>try{if(localStorage.getItem('pinlog-language')==='zh'){document.documentElement.dataset.language='zh';document.documentElement.lang='zh-CN';}}catch(_){}</script>
  <link rel="stylesheet" href="{{ '/assets/css/notebook.css' | relative_url }}">
  {% if page.layout == 'post' %}
  <script type="text/x-mathjax-config">MathJax.Hub.Config({tex2jax:{inlineMath:[['$','$'],['\\(','\\)']],processEscapes:true},messageStyle:'none'});</script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
  {% endif %}
  <script defer src="{{ '/assets/js/notebook.js' | relative_url }}"></script>
</head>
